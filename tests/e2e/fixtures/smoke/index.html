<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harness check</title>
    <style>
      body { margin: 0; padding: 32px; font: 16px/1.5 system-ui, sans-serif; background: #f6f7f9; color: #1d2433; }
      button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid #5b6474; background: #fff; cursor: pointer; }
      #status { margin-top: 16px; }
    </style>
  </head>
  <body>
    <h1>Harness check</h1>
    <p>A static page that proves the browser starts and draws.</p>
    <button type="button" id="go">Check</button>
    <p id="status" role="status">Not checked yet</p>
    <script>
      document.getElementById("go").addEventListener("click", () => {
        document.getElementById("status").textContent = "Browser works";
      });
    </script>
  </body>
</html>
