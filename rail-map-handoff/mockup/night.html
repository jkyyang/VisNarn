<button role="switch" aria-checked="{{ v.checked }}" onClick="{{ v.toggle }}" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 40px; padding: 0 4px; border: 0; border-radius: 10px; background: transparent; color: #F3F5F8; text-align: left"><span style="flex: 1; font-size: 14px">{{ v.label }}</span><span aria-hidden="true" style="position: relative; flex: none; width: 38px; height: 22px; border-radius: 999px; background: {{ v.track }}; transition: background .18s ease-out"><span style="position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 999px; background: {{ v.knob }}; transform: translateX({{ v.x }}); transition: transform .18s ease-out"></span></span></button>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{ creditsOpen }}" hint-placeholder-val="{{ false }}">
<div role="note" style="position: absolute; right: 60px; bottom: 16px; max-width: min(400px, calc(100% - 76px)); padding: 9px 12px; border-radius: 12px; font-size: 12px; line-height: 1.45; color: rgba(243,245,248,.64); box-sizing: border-box; background: rgba(16,20,28,.72); backdrop-filter: blur(20px) saturate(140%); border: 1px solid rgba(255,255,255,.10); box-shadow: 0 8px 32px rgba(0,0,0,.30), inset 0 1px 0 rgba(255,255,255,.06)">Rail network: BTS NTAD North American Rail Network. Basemap: OpenFreeMap © OpenMapTiles, data from OpenStreetMap.</div>
</sc-if>
<button class="gbtn" aria-label="Map data credits" aria-expanded="{{ creditsExp }}" onClick="{{ toggleCredits }}" style="position: absolute; right: 16px; bottom: 16px; display: grid; place-items: center; width: 40px; height: 40px; padding: 0; border-radius: 12px; color: #F3F5F8; box-sizing: border-box; background: rgba(16,20,28,.72); backdrop-filter: blur(20px) saturate(140%); border: 1px solid rgba(255,255,255,.10); box-shadow: 0 8px 32px rgba(0,0,0,.30), inset 0 1px 0 rgba(255,255,255,.06); width: 36px; height: 36px; border-radius: 999px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" style="flex: none; display: block; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 8h.01"></path></svg></button>

</div>
</template>
<script>
// Minimal stand-ins for the design tool's runtime: state + a tiny template renderer.
class DCLogic {
  constructor() { this.props = {}; this.state = {}; }
  setState(patch) { Object.assign(this.state, patch); render(); }
}
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const s = this.state || {};
    const set = (patch) => this.setState(patch);
    const accent = p.accent ?? '#FFC72C';
    const tab = s.tab ?? p.tab ?? 'shops';
    const layersOpen = s.layersOpen ?? p.layersOpen ?? false;
    const carrier = s.carrier ?? p.carrier ?? 'all';
    const optionsOpen = s.optionsOpen ?? p.optionsOpen ?? false;
    const collapsed = s.collapsed ?? false;
    const creditsOpen = s.creditsOpen ?? false;
    const sel = s.sel === undefined ? 'OAK' : s.sel;
    const opts = s.opts || {};
    const ov = s.ov || { network: true };
    const isRoute = tab === 'route';
    const filtered = carrier !== 'all';
    const yn = (v) => (v ? 'true' : 'false');

    const TEXT = '#F3F5F8';
    const DIM = 'rgba(243,245,248,.64)';
    const NEUTRAL = '#C9D1DC';
    const INK = '#12161D';
    const SEL = 'rgba(255,255,255,.09)';
    const KNOB = '#F4F6F9';
    const GLASSBG = 'rgba(16,20,28,.72)';
    const COLORS = { BNSF: '#F0955A', UP: '#E9DFA8', CSX: '#6FB1F2', NS: '#B79CF5', CN: '#F0728A', CPKC: '#56C9A6' };
    const NAMES = { CSX: 'CSXT' };
    const XY = {"ECH":[1046.8,371.9],"EDM":[630.0,111.0],"ELD":[896.4,456.0],"MAR":[1115.9,395.0],"OAK":[1171.1,332.1],"REG":[772.4,178.1],"SAR":[1127.6,342.7],"SAY":[1221.7,364.4],"TXK":[941.4,552.3],"VLD":[1113.5,609.7],"VPL":[969.5,612.8],"WAT":[968.4,353.0]};
    const SHOPS = [["ECH","East Chicago, IN · UTLX","DRAFT-UTLX-ECH","U",["CSX","NS","CPKC"]],["EDM","Edmonton, AB · Procor","DRAFT-PROC-EDM","P",["CN","CPKC"]],["ELD","El Dorado, KS · UTLX","DRAFT-UTLX-ELD","U",["BNSF","UP"]],["MAR","Marion, OH · UTLX","DRAFT-UTLX-MAR","U",["CSX","NS"]],["OAK","Oakville, ON · Procor","DRAFT-PROC-OAK","P",["CN"]],["REG","Regina, SK · Procor","DRAFT-PROC-REG · approximate","P",["CN","CPKC"]],["SAR","Sarnia, ON · Procor","DRAFT-PROC-SAR","P",["CN","CPKC"]],["SAY","Sayre, PA · UTLX","DRAFT-UTLX-SAY","U",["NS","CPKC"]],["TXK","Texarkana, AR · UTLX","DRAFT-UTLX-TXK","U",["BNSF","UP","CPKC"]],["VLD","Valdosta, GA · UTLX","DRAFT-UTLX-VLD","U",["CSX","NS"]],["VPL","Ville Platte, LA · UTLX","DRAFT-UTLX-VPL · 20 km to UP","U",["UP"]],["WAT","Waterloo, IA · UTLX","DRAFT-UTLX-WAT","U",["CN"]]];

    const c = {};
    ['BNSF', 'UP', 'CSX', 'NS', 'CN', 'CPKC', 'OTH'].forEach((id) => {
      const on = filtered && id === carrier;
      let v = { s: NEUTRAL, w: 1.1, o: 0.4, co: 0.32 };
      if (isRoute) {
        v = on ? { s: COLORS[id], w: 1.4, o: 0.55, co: 0.2 } : { s: NEUTRAL, w: 1.1, o: 0.16, co: 0.06 };
      } else if (filtered) {
        v = on ? { s: COLORS[id], w: 1.9, o: 1, co: 0.45 } : { s: NEUTRAL, w: 1.1, o: 0.13, co: 0.05 };
      }
      c[id] = v;
    });

    const col = (k) => (k ? COLORS[k] : 'transparent');
    const shops = SHOPS.map((r) => {
      const id = r[0];
      const cs = r[4];
      const pad = [null, null, null].concat(cs).slice(-3);
      const on = sel === id;
      return {
        name: r[1],
        meta: r[2],
        dotFill: r[3] === 'P' ? TEXT : 'transparent',
        d1: col(pad[0]),
        d2: col(pad[1]),
        d3: col(pad[2]),
        carrierText: 'Carriers: ' + cs.map((k) => NAMES[k] || k).join(', '),
        bg: on ? SEL : 'transparent',
        editO: on ? 1 : 0,
        pressed: yn(on),
        pick: () => set({ sel: on ? null : id })
      };
    });
    const selXY = sel ? XY[sel] : null;

    const carriers = ['BNSF', 'UP', 'CSX', 'NS', 'CN', 'CPKC'].map((id) => {
      const on = carrier === id;
      const lit = !filtered || on;
      return {
        name: NAMES[id] || id,
        color: COLORS[id],
        lineO: lit ? 1 : 0.35,
        bg: on ? SEL : 'transparent',
        fg: lit ? TEXT : DIM,
        weight: on ? 600 : 400,
        hint: on ? 'Only' : '',
        pressed: yn(on),
        pick: () => set({ carrier: on ? 'all' : id })
      };
    });

    const mkSwitch = (label, on, toggle) => {
      return {
        label: label,
        checked: yn(on),
        track: on ? accent : 'rgba(255,255,255,.16)',
        knob: on ? INK : KNOB,
        x: on ? '16px' : '0px',
        toggle: toggle
      };
    };
    const OPTS = [['regional', 'Regional lines', 'Regional'], ['short', 'Short lines', 'Short lines'], ['passenger', 'Passenger lines', 'Passenger'], ['stops', 'Turn at stops', 'Turn at stops']];
    const options = OPTS.map((r) => {
      const next = Object.assign({}, opts);
      next[r[0]] = !opts[r[0]];
      return mkSwitch(r[1], !!opts[r[0]], () => set({ opts: next }));
    });
    const active = OPTS.filter((r) => opts[r[0]]).map((r) => r[2]);
    const summary = active.length ? ['Class I'].concat(active).join(' · ') : 'Class I only';
    const OVS = [['network', 'Rail network'], ['tracks', 'Real tracks']];
    const overlays = OVS.map((r) => {
      const next = Object.assign({}, ov);
      next[r[0]] = !ov[r[0]];
      return mkSwitch(r[1], !!ov[r[0]], () => set({ ov: next }));
    });

    return {
      accent: accent,
      c: c,
      shops: shops,
      carriers: carriers,
      options: options,
      overlays: overlays,
      isRoute: isRoute,
      isShops: !isRoute,
      panelOpen: !collapsed,
      collapsed: collapsed,
      layersOpen: layersOpen,
      creditsOpen: creditsOpen,
      optionsOpen: optionsOpen,
      thumbX: isRoute ? '0%' : '100%',
      routeColor: isRoute ? TEXT : DIM,
      shopsColor: isRoute ? DIM : TEXT,
      routeSel: yn(isRoute),
      shopsSel: yn(!isRoute),
      optionsExp: yn(optionsOpen),
      layersExp: yn(layersOpen),
      creditsExp: yn(creditsOpen),
      chevRot: optionsOpen ? '180deg' : '0deg',
      optSummary: optionsOpen ? '' : summary,
      selX: selXY ? selXY[0] : 0,
      selY: selXY ? selXY[1] : 0,
      selO: !isRoute && selXY ? 1 : 0,
      routeO: isRoute ? 1 : 0,
      layersIcon: layersOpen ? INK : TEXT,
      layersBg: layersOpen ? accent : GLASSBG,
      badgeO: filtered ? 1 : 0,
      showAllVis: filtered ? 'visible' : 'hidden',
      goRoute: () => set({ tab: 'route' }),
      goShops: () => set({ tab: 'shops' }),
      collapse: () => set({ collapsed: true }),
      expand: () => set({ collapsed: false }),
      toggleLayers: () => set({ layersOpen: !layersOpen }),
      toggleCredits: () => set({ creditsOpen: !creditsOpen }),
      toggleOptions: () => set({ optionsOpen: !optionsOpen }),
      showAll: () => set({ carrier: 'all' })
    };
  }
}
const comp = new Component();
const tpl = document.getElementById('tpl');
const WHOLE = /^\s*\{\{([^}]+)\}\}\s*$/;
function look(path, scope) {
  path = path.trim();
  if (path === 'true') return true;
  if (path === 'false') return false;
  return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), scope);
}
function interp(str, scope) {
  return str.replace(/\{\{([^}]+)\}\}/g, (_, p) => { const v = look(p, scope); return v == null ? '' : v; });
}
function build(node, scope, out) {
  if (node.nodeType === 3) { out.appendChild(document.createTextNode(interp(node.nodeValue, scope))); return; }
  if (node.nodeType !== 1) return;
  const tag = node.localName;
  if (tag === 'sc-if') {
    if (look(WHOLE.exec(node.getAttribute('value'))[1], scope)) node.childNodes.forEach((c) => build(c, scope, out));
    return;
  }
  if (tag === 'sc-for') {
    const list = look(WHOLE.exec(node.getAttribute('list'))[1], scope) || [];
    const as = node.getAttribute('as');
    list.forEach((item, i) => {
      const s = Object.create(scope); s[as] = item; s.$index = i;
      node.childNodes.forEach((c) => build(c, s, out));
    });
    return;
  }
  const el = node.cloneNode(false);
  for (const a of Array.from(node.attributes)) {
    const m = WHOLE.exec(a.value);
    if (a.name.toLowerCase() === 'onclick') {
      el.removeAttribute(a.name);
      const fn = m && look(m[1], scope);
      if (fn) el.addEventListener('click', fn);
    } else if (a.value.includes('{{')) {
      el.setAttribute(a.name, m ? String(look(m[1], scope)) : interp(a.value, scope));
    }
  }
  node.childNodes.forEach((c) => build(c, scope, el));
  out.appendChild(el);
}
function render() {
  const app = document.getElementById('app');
  const old = app.querySelector('.scroll');
  const top = old ? old.scrollTop : 0;
  const frag = document.createDocumentFragment();
  tpl.content.childNodes.forEach((c) => build(c, comp.renderVals(), frag));
  app.replaceChildren(frag);
  const now = app.querySelector('.scroll');
  if (now) now.scrollTop = top;
}
render();
</script>
</body>
</html>
